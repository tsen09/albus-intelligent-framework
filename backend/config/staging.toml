# ============================================================================
# Albus - Staging Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Application Configuration
# ----------------------------------------------------------------------------

[application]
name = "Albus"
environment = "staging"
debug = false
host = "0.0.0.0"
port = 8000

# ----------------------------------------------------------------------------
# Database Configuration
# ----------------------------------------------------------------------------

[database]
host = "localhost"
port = 5432
name = "albus_staging"
driver = "postgresql+asyncpg"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------

[logging]
level = "INFO"

# Console Logging
console_enabled = true
console_format = "json" # auto, console, json

# File Logging
file_enabled = true
directory = "logs"
module_namespace = "albus"

# Log Rotation
rotation = "midnight"
rotation_interval = 1
retention_days = 14
compression = true

# Security
redact_sensitive = true
