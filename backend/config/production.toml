# ============================================================================
# Albus - Production Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Application Configuration
# ----------------------------------------------------------------------------

[application]
name = "Albus"
environment = "production"
debug = false
host = "0.0.0.0"
port = 8000

# ----------------------------------------------------------------------------
# Database Configuration
# ----------------------------------------------------------------------------

[database]
host = "localhost"
port = 5432
name = "albus"
driver = "postgresql+asyncpg"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------

[logging]
level = "ERROR"
console_enabled = true
file_enabled = true
directory = "logs"
filename = "albus.log"
rotation = "midnight"
retention_days = 90
compression = true
format = "production"
