# ============================================================================
# Albus - Development Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Application Configuration
# ----------------------------------------------------------------------------

[application]
name = "Albus"
environment = "development"
debug = true
host = "127.0.0.1"
port = 8000

# ----------------------------------------------------------------------------
# Database Configuration
# ----------------------------------------------------------------------------

[database]
host = "localhost"
port = 5432
name = "albus_dev"
driver = "postgresql+asyncpg"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------

[logging]
level = "INFO"

# Console Logging
console_enabled = true
console_format = "auto" # auto, console, json

# File Logging
file_enabled = true
directory = "logs"
module_namespace = "albus"

# Log Rotation
rotation = "midnight"
rotation_interval = 1
retention_days = 14
compression = true

# Security
redact_sensitive = true