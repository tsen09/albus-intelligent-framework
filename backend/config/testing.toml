# ============================================================================
# Albus - Testing Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Application Configuration
# ----------------------------------------------------------------------------

[application]
name = "Albus"
environment = "testing"
debug = true
host = "127.0.0.1"
port = 8001

# ----------------------------------------------------------------------------
# Database Configuration
# ----------------------------------------------------------------------------

[database]
host = "localhost"
port = 5432
name = "albus_test"
driver = "postgresql+asyncpg"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------

[logging]
level = "DEBUG"

# Console Logging
console_enabled = true
console_format = "console" # auto, console, json

# File Logging
file_enabled = true
directory = "logs"
module_namespace = "albus"

# Log Rotation
rotation = "midnight"
rotation_interval = 1
retention_days = 3
compression = false

# Security
redact_sensitive = true
