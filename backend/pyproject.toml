
# ============================================================================
# Albus - Modular Python Backend Framework
# ============================================================================

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "albus"
version = "0.1.0"
description = "A modular Python backend framework providing reusable, production-ready infrastructure for intelligent assistant and agent applications."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

authors = [
    { name = "Tanmoy Sen", email = "sentanmoy09@gmail.com" },
]

keywords = [
    "modular-backend",
    "python-framework",
    "backend-infrastructure",
    "intelligent-agents",
    "agent-framework",
    "assistant-framework",
    "api-infrastructure",
    "fastapi",
    "database-management",
    "sqlalchemy",
    "configuration-management",
    "authorization",
    "load-balancing",
    "observability",
    "logging",
    "production-ready",
    "artificial-intelligence",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ============================================================================
# Production Dependencies
# ============================================================================

dependencies = [
    # ------------------------------------------------------------------------
    # Backend and API
    # ------------------------------------------------------------------------

    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.34.0",

    # ------------------------------------------------------------------------
    # Database and ORM
    # ------------------------------------------------------------------------

    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # ------------------------------------------------------------------------
    # Configuration and Validation
    # ------------------------------------------------------------------------

    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",

    # ------------------------------------------------------------------------
    # Template Rendering
    # ------------------------------------------------------------------------

    "jinja2>=3.1.6",

    # ------------------------------------------------------------------------
    # Logging and Observability Foundation
    # ------------------------------------------------------------------------

    "structlog>=25.2.0",
    "asgi-correlation-id>=4.3.4",
]

# ============================================================================
# Optional Production Dependencies
# ============================================================================

[project.optional-dependencies]

# ---------------------------------------------------------------------------
# Command Line Interface
# ---------------------------------------------------------------------------

cli = [
    "typer>=0.27.2,<1.0.0",
]

# ---------------------------------------------------------------------------
# Authentication and Security
# ---------------------------------------------------------------------------

auth = [
    "pwdlib[argon2]>=0.2.1",
    "PyJWT[crypto]>=2.10.0",
]

# ---------------------------------------------------------------------------
# File Uploads and Forms
# ---------------------------------------------------------------------------

uploads = [
    "python-multipart>=0.0.20",
]

# ---------------------------------------------------------------------------
# Rate Limiting
# ---------------------------------------------------------------------------

rate-limit = [
    "slowapi>=0.1.9",
]

# ---------------------------------------------------------------------------
# LangChain and LangGraph
# ---------------------------------------------------------------------------

agents = [
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langgraph>=1.0.2",
]

# ---------------------------------------------------------------------------
# PostgreSQL Checkpointing for LangGraph
# ---------------------------------------------------------------------------

postgres-checkpoint = [
    "langgraph-checkpoint-postgres>=3.0.1",
    "psycopg[binary,pool]>=3.2",
]

# ---------------------------------------------------------------------------
# LLM Providers
# ---------------------------------------------------------------------------

openai = [
    "langchain-openai>=1.0.2",
]

anthropic = [
    "langchain-anthropic>=1.7.2",
]

ollama = [
    "langchain-ollama>=1.1.0",
]

google-genai = [
    "langchain-google-genai>=4.3.7",
]

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

cache = [
    "redis>=7.4.0",
]

valkey = [
    "valkey[libvalkey]>=6.1.0",
]

# ---------------------------------------------------------------------------
# Monitoring and Observability
# ---------------------------------------------------------------------------

observability = [
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "langfuse>=3.9.1",
]

# ---------------------------------------------------------------------------
# Search
# ---------------------------------------------------------------------------

search = [
    "ddgs>=9.6.0",
]

# ---------------------------------------------------------------------------
# External Integrations
# ---------------------------------------------------------------------------

supabase = [
    "supabase>=2.15.0",
]

memory = [
    "mem0ai>=1.0.0",
]

# ============================================================================
# Development Dependencies
# ============================================================================

[dependency-groups]

dev = [
    # ------------------------------------------------------------------------
    # Testing
    # ------------------------------------------------------------------------

    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",

    # ------------------------------------------------------------------------
    # Code Quality and Formatting
    # ------------------------------------------------------------------------

    "ruff>=0.11.4",
    "pyright>=1.1.390",

    # ------------------------------------------------------------------------
    # Template Linting
    # ------------------------------------------------------------------------

    "djlint==1.36.4",

    # ------------------------------------------------------------------------
    # Code Complexity and Performance
    # ------------------------------------------------------------------------

    "radon>=6.0.1",
    "pyinstrument>=5.1.2",

    # ------------------------------------------------------------------------
    # Security and Dependency Auditing
    # ------------------------------------------------------------------------

    "detect-secrets>=1.5.0",
    "pip-audit>=2.9.0",

    # ------------------------------------------------------------------------
    # Git Hooks and Workflow Security
    # ------------------------------------------------------------------------

    "prek>=0.5.3,<1.0.0",
    "zizmor>=1.30.1",

    # ------------------------------------------------------------------------
    # CLI Development
    # ------------------------------------------------------------------------

    "typer>=0.27.2,<1.0.0",
]

# ---------------------------------------------------------------------------
# GitHub Actions
# ---------------------------------------------------------------------------

github-actions = [
    "smokeshow>=0.5.0",
]

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]

line-length = 119
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "*.ipynb",
]

[tool.ruff.lint]

select = [
    "E",       # pycodestyle errors
    "F",       # Pyflakes
    "I",       # Import sorting
    "UP",      # Pyupgrade
    "B",       # flake8-bugbear
    "ERA",     # Eradicate commented-out code
    "D",       # Pydocstyle
]

ignore = [
    "E501",    # Line length handled by formatter
    "D203",    # Incompatible with D211
    "D213",    # Incompatible with D212
    "B904",    # Exception chaining
    "B008",    # Function calls in default arguments
]

unfixable = [
    "B",
]

[tool.ruff.lint.pydocstyle]

convention = "google"

[tool.ruff.lint.per-file-ignores]

"__init__.py" = [
    "E402",
    "D104",
]

# ============================================================================
# Ruff Formatter
# ============================================================================

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]

branch = true
source = ["backend"]

omit = [
    "*/migrations/*",
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]

show_missing = true
skip_covered = true
fail_under = 80

# ============================================================================
# Pyright Configuration
# ============================================================================

[tool.pyright]

pythonVersion = "3.13"
typeCheckingMode = "standard"

exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/migrations",
    "**/venv",
]

stubPath = "typings"

reportDuplicateImport = "error"
reportInvalidTypeVarUse = "error"
reportSelfClsParameterName = "error"

reportImplicitOverride = "warning"

# ============================================================================
# Typos Configuration
# ============================================================================

[tool.typos.files]

extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]

extend-ignore-re = [
    # GitHub usernames in @mentions
    '@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*',

    # Package names in automated dependency update PR titles
    'Bump certifi ',
]

[tool.typos.default.extend-identifiers]

alls = "alls"

# ============================================================================
# uv Configuration
# ============================================================================

[tool.uv]

package = false

# ============================================================================
# Project URLs
# ============================================================================

[project.urls]

Homepage = "https://github.com/tsen09/albus"
Repository = "https://github.com/tsen09/albus"
Issues = "https://github.com/tsen09/albus/issues"
